# Builds and tests everything on every push and pull request. Deploying stays a local step
# (scripts/deploy.sh); this only proves the code compiles, the tests pass and the Terraform is valid.
name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    name: API build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test

  app:
    name: Front end build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/app/package-lock.json
      - run: npm ci
      - run: npm run build

  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.1
      # The Lambda's source hash is read from the zip, so validate needs the zip to exist.
      - run: ./scripts/build-lambdas.sh
      - run: terraform fmt -check -recursive
        working-directory: iac/terraform
      - run: terraform init -backend=false -input=false
        working-directory: iac/terraform
      - run: terraform validate
        working-directory: iac/terraform
